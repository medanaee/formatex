[package]
name = "formatex-parser"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-minimal-protocol = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
