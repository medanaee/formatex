<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatex: Markdown to bilingual PDF</title>
    <meta name="description" content="Formatex turns Markdown into exact bilingual (Persian / English) PDFs with the Typst engine. فرمتکس مارک‌داون را به PDF دوزبانه تبدیل می‌کند." />
    <meta property="og:title" content="Formatex" />
    <meta property="og:description" content="Markdown to exact bilingual PDFs: an editor, a live preview and PDF export in one light app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />
    <meta name="theme-color" content="#07080c" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The direction is set before the first paint, so the page does not flash
      try {
        if (localStorage.getItem("formatex-landing-lang") === "fa") {
          document.documentElement.lang = "fa"
          document.documentElement.dir = "rtl"
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
