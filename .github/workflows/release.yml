name: Release

# Runs on every push to main, and builds only in two cases:
#   1. The version in src-tauri/tauri.conf.json went up: a new release `v<version>` is published with every build.
#   2. A commit of the push has `[build]` in its message: the files of the LATEST release are built again and replaced (no new
#      release, the tag stays where it is). Say which platforms after `build`, or none for all of them:
#        [build]  [build all]  [build android]  [build windows linux]  [build desktop]
#      Words: windows, macos, linux, android, desktop (= windows + macos + linux), all. A new version always builds everything.
# Anything else is skipped. "Run workflow" by hand builds the platforms you tick and keeps the files as workflow artifacts only.
#
# Builds: Windows, macOS (Apple silicon and Intel), Linux, and Android with one APK per ABI.
# Optional secrets (Android): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the APKs are signed with a throw-away key: they install, but cannot update an app signed with another key.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: Windows
        type: boolean
        default: true
      macos:
        description: macOS (Apple silicon and Intel)
        type: boolean
        default: true
      linux:
        description: Linux
        type: boolean
        default: true
      android:
        description: Android (one APK per ABI)
        type: boolean
        default: true

permissions:
  contents: write

env:
  TYPST_VERSION: v0.15.1

defaults:
  run:
    working-directory: formatex-app

jobs:
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      tag: ${{ steps.decide.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      desktop_matrix: ${{ steps.decide.outputs.desktop_matrix }}
      android: ${{ steps.decide.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_MACOS: ${{ inputs.macos }}
          IN_LINUX: ${{ inputs.linux }}
          IN_ANDROID: ${{ inputs.android }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          mode=none; tag=""; words=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode=manual
          else
            old=""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              old=$(git show "$BEFORE:formatex-app/src-tauri/tauri.conf.json" 2>/dev/null | jq -r .version || true)
            fi
            if [ "$old" != "$version" ]; then
              mode=new; tag="v$version"
            else
              range="${BEFORE:-HEAD~1}..HEAD"
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="HEAD -1"; fi
              # `[build]`, `[build android]`, `[build windows linux]`: what follows "build" says which platforms
              tags=$(git log --format=%B $range | grep -oiE '\[build[^]]*\]' || true)
              if [ -n "$tags" ]; then
                words=$(echo "$tags" | tr 'A-Z' 'a-z' | sed -E 's/\[build//; s/\]//')
                mode=override
                tag=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
                if [ -z "$tag" ]; then mode=new; tag="v$version"; fi
              fi
            fi
          fi

          # Which platforms: all for a new version and for a bare `[build]`; otherwise the ones named
          win=false; mac=false; lin=false; and=false
          if [ "$mode" = manual ]; then
            [ "$IN_WINDOWS" = true ] && win=true
            [ "$IN_MACOS" = true ] && mac=true
            [ "$IN_LINUX" = true ] && lin=true
            [ "$IN_ANDROID" = true ] && and=true
          elif [ "$mode" = override ]; then
            for w in $words; do
              case "$w" in
                all) win=true; mac=true; lin=true; and=true ;;
                desktop) win=true; mac=true; lin=true ;;
                windows) win=true ;;
                macos) mac=true ;;
                linux) lin=true ;;
                android) and=true ;;
                *) echo "::warning::unknown platform '$w' in [build ...]" ;;
              esac
            done
            # Nothing (valid) named: everything
            if [ "$win$mac$lin$and" = falsefalsefalsefalse ]; then win=true; mac=true; lin=true; and=true; fi
          elif [ "$mode" = new ]; then
            win=true; mac=true; lin=true; and=true
          fi
          matrix='[]'
          add() { matrix=$(echo "$matrix" | jq -c ". + [$1]"); }
          [ "$win" = true ] && add '{"name":"Windows","os":"windows-latest","args":"","rust-targets":""}'
          [ "$mac" = true ] && add '{"name":"macOS (Apple silicon)","os":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin"}'
          [ "$mac" = true ] && add '{"name":"macOS (Intel)","os":"macos-latest","args":"--target x86_64-apple-darwin","rust-targets":"x86_64-apple-darwin"}'
          [ "$lin" = true ] && add '{"name":"Linux","os":"ubuntu-22.04","args":"","rust-targets":""}'

          echo "version $version, mode $mode, tag $tag, windows $win, macos $mac, linux $lin, android $and"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "desktop_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "android=$and" >> "$GITHUB_OUTPUT"
      # A new version gets its release here (published, tag at this commit); an override finds the latest one
      - id: release
        if: steps.decide.outputs.mode == 'new' || steps.decide.outputs.mode == 'override'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Formatex $TAG" --generate-notes
          id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.mode != 'none' && needs.plan.outputs.desktop_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ env.TYPST_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: formatex-app/package-lock.json
      # The .deb files are cached, so after the first run nothing is downloaded and `apt update` is not run
      - name: Install Linux prerequisites (Tauri v2)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formatex-app/src-tauri
          key: ${{ matrix.args }}
      - run: npm ci
      # Builds only; the files are published by the `publish` job, so two jobs never touch the same release asset
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: formatex-app
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: formatex-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            formatex-app/src-tauri/target/**/release/bundle/**/*.msi
            formatex-app/src-tauri/target/**/release/bundle/**/*.exe
            formatex-app/src-tauri/target/**/release/bundle/**/*.dmg
            formatex-app/src-tauri/target/**/release/bundle/**/*.deb
            formatex-app/src-tauri/target/**/release/bundle/**/*.rpm
            formatex-app/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  android:
    name: Android (one APK per ABI)
    needs: plan
    if: needs.plan.outputs.mode != 'none' && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ env.TYPST_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: formatex-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The action would also run `sdkmanager tools`, a package that no longer exists, and fail; the NDK is installed below
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install the NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formatex-app/src-tauri
          key: android
      - run: npm ci

      # The Android project is generated from tauri.conf.json (identifier com.formatex.org); it is not kept in git
      - run: npx tauri android init --ci

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="$KEY_ALIAS"; storepass="$KEYSTORE_PASSWORD"; keypass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with a throw-away key"
            alias=formatex; storepass=$(openssl rand -hex 16); keypass="$storepass"
            keytool -genkeypair -keystore "$keystore" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$storepass" -keypass "$keypass" -dname "CN=Formatex, O=Formatex, C=IR"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$storepass"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEY_PASSWORD=$keypass"
          } >> "$GITHUB_ENV"
      - run: node scripts/android-signing.mjs
      - run: node scripts/android-immersive.mjs

      # One APK per ABI, for the phones: arm64-v8a and armeabi-v7a. (x86 and x86_64 are emulators; each ABI recompiles every
      # dependency, so leaving them out halves the build. Add `--target i686 x86_64` here when they are needed.)
      - run: npx tauri android build --apk --split-per-abi --target aarch64 armv7

      - name: Name the APKs by ABI
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            abi=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "$RUNNER_TEMP/apks/formatex-${abi}.apk"
          done
          ls -l "$RUNNER_TEMP/apks"
      - uses: actions/upload-artifact@v4
        with:
          name: formatex-android-apks
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error

  # Every build that succeeded is put on the release (a new one, or the latest one for `[build ...]`), replacing files of the same name
  publish:
    name: Publish to the release
    needs: [plan, desktop, android]
    if: ${{ !cancelled() && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'override') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: formatex-*
          path: files
      - name: Upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find files -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -print0 \
            | xargs -0 -r gh release upload "${{ needs.plan.outputs.tag }}" --clobber --repo "${{ github.repository }}"
          find files -type f | sed 's/^/  /'
